[colors]
background = #ff435060
foreground = #ffffff
transparent = #00000000
accent = #fec006
green = #43a047
red = #e53935
muted = #b0bec5

[bar/base]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = true
bottom = false
fixed-center = true
height = 40
offset-y = 12
background = ${colors.background}
foreground = ${colors.foreground}
radius = 10
padding-left = 1
padding-right = 1
module-margin = 1
font-0 = Hack Nerd Font Mono:size=9;2
font-1 = Hack Nerd Font Mono:size=12;3
wm-restack = bspwm
enable-ipc = true

[bar/logo]
inherit = bar/base
width = 3%
offset-x = 1%
modules-center = logo

[bar/clock]
inherit = bar/base
width = 13%
offset-x = 4.5%
modules-center = date

[bar/network]
inherit = bar/base
width = 15%
offset-x = 18%
modules-center = network

[bar/vpn]
inherit = bar/base
width = 12%
offset-x = 33.5%
modules-center = vpn

[bar/workspaces]
inherit = bar/base
width = 18%
offset-x = 46%
modules-center = bspwm

[bar/metrics]
inherit = bar/base
width = 15%
offset-x = 64.5%
modules-center = cpu memory

[bar/target]
inherit = bar/base
width = 15.5%
offset-x = 80%
modules-center = target

[bar/power]
inherit = bar/base
width = 3%
offset-x = 96%
modules-center = power

[module/logo]
type = custom/text
format = 
format-font = 2
format-foreground = ${colors.accent}
click-left = ~/.local/bin/wallpaper-cycle.sh --next
click-right = ~/.local/bin/wallpaper-cycle.sh --select

[module/date]
type = internal/date
interval = 5
date = %b %d
time = %H:%M
label =  %date%  |  %time%

[module/network]
type = custom/script
exec = ~/.local/bin/interface-status.sh
interval = 5
format-foreground = ${colors.foreground}

[module/vpn]
type = custom/script
exec = ~/.local/bin/vpn-status.sh
interval = 5
format-foreground = ${colors.green}
click-left = ~/.local/bin/vpn-manager.sh
click-right = ~/.local/bin/vpn-manager.sh --log

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
enable-click = true
enable-scroll = true
label-focused = ●
label-focused-foreground = ${colors.accent}
label-focused-padding = 1
label-occupied = •
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1
label-empty = ·
label-empty-foreground = ${colors.foreground}
label-empty-padding = 1
label-urgent = !
label-urgent-foreground = ${colors.red}
label-urgent-padding = 1

[module/cpu]
type = internal/cpu
interval = 2
label =  CPU %percentage:2%%

[module/memory]
type = custom/script
exec = ~/.local/bin/memory-status.sh
interval = 2

[module/target]
type = custom/ipc
hook-0 = ~/.local/bin/target-status.sh
initial = 1
format-foreground = ${colors.foreground}
format-prefix = " "

[module/power]
type = custom/text
format = 
format-font = 2
format-foreground = ${colors.red}
click-left = ~/.local/bin/power-menu.sh
