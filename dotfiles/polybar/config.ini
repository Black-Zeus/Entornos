[colors]
background = #dd1e222a
foreground = #f8f8f2
muted = #6272a4
accent = #50fa7b
urgent = #ff5555

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 28
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2
padding-left = 1
padding-right = 1
module-margin = 1
font-0 = monospace:size=10;2
modules-left = bspwm xwindow
modules-right = vpn target cpu memory network pulseaudio date
tray-position = right
wm-restack = bspwm
enable-ipc = true

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
enable-click = true
enable-scroll = true
label-focused = %name%
label-focused-background = ${colors.accent}
label-focused-foreground = #1e222a
label-focused-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.muted}
label-empty-padding = 1
label-urgent = %name%!
label-urgent-background = ${colors.urgent}
label-urgent-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = CPU 
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = RAM 
label = %percentage_used:2%%

[module/network]
type = internal/network
interface-type = wired
interval = 3
label-connected = LAN %local_ip%
label-disconnected = LAN --
label-disconnected-foreground = ${colors.muted}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = VOL <label-volume>
label-muted = VOL muted
label-muted-foreground = ${colors.muted}

[module/date]
type = internal/date
interval = 5
date = %Y-%m-%d
time = %H:%M
label = %date% %time%

# Estos scripts siempre devuelven estado válido cuando no existe VPN u objetivo.
[module/vpn]
type = custom/script
exec = ~/.local/bin/vpn-status.sh
interval = 5

[module/target]
type = custom/script
exec = ~/.local/bin/target-status.sh
interval = 2

# Preparados para una iteración posterior:
# - estado de VMware Tools
# - batería (si la VM expone una)
# - IP local por interfaz seleccionable
