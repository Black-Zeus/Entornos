# Configuración conservadora para VMware: composición básica sin blur.
backend = "xrender";
vsync = true;
shadow = true;
shadow-radius = 8;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-opacity = 0.35;
fading = false;
inactive-opacity = 1.0;
active-opacity = 1.0;
detect-rounded-corners = true;
detect-client-opacity = true;
# VMware puede perder eventos de repintado en las tarjetas transparentes de
# Polybar. El repintado completo prioriza estabilidad sobre un ahorro marginal.
use-damage = false;
corner-radius = 12;

# Conserva rectas las demás aplicaciones; el redondeo se limita a Kitty.
rounded-corners-exclude = [
  "class_g != 'kitty'"
];

shadow-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'Dunst'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];
